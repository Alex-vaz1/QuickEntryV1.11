name: tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel viejos runs del mismo PR cuando se pushea un nuevo commit
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: AHK v2 tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2 (pinned 2.0.18 from GitHub Releases)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "2.0.18"
          # GitHub Releases > autohotkey.com — URL estable, retención garantizada.
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v${version}/AutoHotkey_${version}.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ahk.zip"
          $dest = Join-Path $env:RUNNER_TEMP "ahk"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -MaximumRedirection 5
          Write-Host "Downloaded ($((Get-Item $zip).Length) bytes)"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Write-Host "Extracted to $dest. Contents:"
          Get-ChildItem $dest | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          $ahk = Join-Path $dest "AutoHotkey64.exe"
          if (-not (Test-Path $ahk)) {
              throw "AutoHotkey64.exe no encontrado en '$ahk'"
          }
          "AHK_V2=$ahk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "AHK_V2 exported as: $ahk"
          & $ahk /Version

      - name: Run test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "AHK_V2 = $env:AHK_V2"
          if (-not (Test-Path $env:AHK_V2)) { throw "AHK_V2 no apunta a archivo existente: '$env:AHK_V2'" }
          Write-Host "Running Tests/runner.ps1..."
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -ExecutionPolicy Bypass -File Tests/runner.ps1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::runner.ps1 exited with code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Upload test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            ${{ runner.temp }}/Test_*.out
            ${{ runner.temp }}/Test_*.err
          if-no-files-found: ignore
          retention-days: 7
